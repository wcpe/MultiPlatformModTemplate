# 根构建全局属性（被本构建内所有子项目继承）

# 项目坐标 group（version 的唯一来源是根目录 VERSION 文件，由 build.gradle.kts 读取）
group=top.wcpe.mc.mpmt

# Gradle 守护进程参数：统一 UTF-8，避免中文注释 / 资源乱码。
# 内存按最大车道（forge/26.2 需 4g）统一设定——车道级 -Xmx 在子模块粒度不生效（ADR-0026）。
#
# 注：2026-10-28 的性能评估曾试过抬到 -Xmx6g 并加 G1 系列参数，经 JFR 实测后**没有采纳**：
# 配置阶段全程堆使用不足 100MB、committed 仅 2GB、最长 GC 停顿 71ms——4g 完全够用，
# 抬高上限与调整 region 尺寸对这类负载没有任何可测收益。
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# 构建缓存、并行与配置缓存，加速多模块 / 多车道构建。
# 配置缓存：全仓已完成 CC 兼容改造（任务动作不再捕获脚本对象 / Project / Configuration），
# 默认开启以复用配置阶段；如需排查配置期问题可用 --no-configuration-cache 临时关闭。
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# 文件系统 watching：本仓没有"边改边构建"的长驻 watch 场景（IDE 走自己的进程），
# 而 CI 与本机全量构建一直用 `--no-watch-fs` 显式关它。在这里关掉默认值，
# 省得每处调用都得记得传参；需要连续观察文件变化时用 `--watch-fs` 显式打开。
org.gradle.vfs.watch=false

# ── Isolated Projects（Gradle 9 的跨工程隔离模型）──────────────────────────────
# 全仓已按 IP 口径完成改造：工程坐标与版本经 settings 的 gradle.lifecycle.beforeProject
# 下发、跨工程数据一律走 gradle.extensions 里的普通数据（allProjectPaths /
# domainModuleDependencies / projectsWithBuildTask / laneDirectories），没有任何
# allprojects / subprojects 式的跨工程模型访问。WCPE Loom 亦已完成 IP 适配。
#
# 实测收益（--dry-run 只算任务图，先清空配置缓存）：
#   无 IP：35s    启用 IP：21~22s（-37%）
#   配置缓存冷启动：无 IP 31s → 启用 IP 14s（-55%）
# 机制：IP 让各工程可**并行配置**，直接压缩配置阶段的关键路径。
#
# ⚠ 副作用（已修）：IP 开启并行配置后，settings.gradle.kts 里三张共享登记表必须
# 是线程安全的并发容器，否则配置缓存序列化阶段会报
# "The map is likely broken or corrupted because of a data race"。
org.gradle.unsafe.isolated-projects=true

# A 车道机器人目录（mc-testkit 的 Gradle 属性 mcTestkit.botDir，相对**根工程**解析）：
# 默认值给 e2e/bot，使 :e2e:harness:e2eSmoke 无需额外 -P 参数即可定位 mineflayer 入口脚本。
mcTestkit.botDir=e2e/bot

# ── WCPE Loom 版本：全仓单一真源 ────────────────────────────────────────────────
# 改版本只改这一行。消费点全部从这里读，不允许再写版本字面量：
#   · settings.gradle.kts  → pluginManagement.plugins（插件解析的唯一版本来源）
#   · build.gradle.kts     → 根 plugins { apply false }（只写 id，不写版本）
#   · platform/*/*/build.gradle.kts → loomVersion（车道元数据 + mpmt.test.loomVersion）
# 之所以提到 gradle.properties：Gradle 的 plugins {} 块不接受变量，只能靠
# pluginManagement.plugins 统一定版本；而 lanes 侧要读同一个值，也必须有可读真源。
mpmt.loomVersion=1.17.16

# ── loom 跨项目数据收集：关闭「项目依赖的 mod 数据」探测 ──────────────────────────
# loom 会遍历每个 loom 工程的 ProjectDependency，试图拉取对方的
# loomProjectDataElements 变体（access widener / access transformer / mixin 数据）。
# 本仓被 loom 车道依赖的工程（core:* 与 platform/{fabric,forge,sponge}-api）全部**不是
# loom 工程**，既没有该变体，也没有任何 AW/AT 文件（全仓 .accesswidener / _at.cfg 为 0 个），
# 于是每次配置都会为每个「车道 × 依赖」组合打印一条「跨项目数据在配置期不可得」的警告
# ——启用 Isolated Projects 时多达 232 条。
#
# 该开关的**实际作用**（反编译 + 源码核对，判断点共 5 处）：
#   · ProjectView：跳过 ensureDependencyEvaluated()——非 IP 时它内部会调
#     evaluationDependsOn()，正是官方明确的跨项目求值反模式；并跳过噪音警告；
#   · DeobfSpecContext / RemappedSpecContext：为真时**确实不再把依赖项目的 mod 数据
#     并入 spec context**——即 allMods / dependentMods / getCompileRuntimeProjectMods
#     都拿不到依赖项目的 fmj、compile∩runtime 交集与 dependency transform。
#
# 也就是说：这不是「只关告警」，而是**真的不做依赖项目的数据收集**。
#
# 本仓今天无损失的原因（不是「机制上无影响」）：车道只依赖非 loom 工程，且全仓零 AW/AT，
# 所以那条数据通道本来只能返回空。已实证：开关开/关各做一次 --rerun-tasks 全量重建，
# 13 个发布产物 SHA-256 逐字节一致——该实验只证明「本仓当前无损失」，不证明机制等价。
#
# ⚠ 一旦引入 loom 工程之间的项目依赖（车道互引、或把 mc-shared 做成 loom 模块），
# 必须关掉本开关并重新验证产物，否则会**静默丢失**依赖项目的 mod 数据。
# 另注意属性名是 Dependent（方法名是 Dependant），按方法名拼属性会静默失效。
fabric.loom.disableProjectDependentMods=true

# 本机 Maven 仓库兜底的允许坐标组（逗号分隔，ADR-0029 / ADR-0032）。
# settings.gradle.kts 的 pluginManagement.repositories.mavenLocal { content } 只按本清单放行，
# 上游 marker 临时不可用时才解析这些组；放开作用域会让本机 m2 的任意制品污染插件解析。
# 清单放在这里而不是直接写进 settings：Gradle 的仓库内容过滤器只写不可读，
# 提成属性后可由测试按结构化数据核对（RealServerGateContractTest）。
# top.wcpe.loom / top.wcpe.loom-companion / top.wcpe.loom-no-remap / top.wcpe.loom-remap /
# top.wcpe.loom-repositories / dev.architectury：本机发布 wcpe-loom 新版本后需要它们都能被解析。
# includeGroup 是精确匹配——loom 的 5 个插件 marker 与 1 个实现各是一个组，逐个列出。
# marker 在 top.wcpe.loom*，实现发布在 dev.architectury（architectury-loom），两者缺一不可。
# 见 ADR-0032。
mpmt.localMavenGroups=top.wcpe.mc-testkit,top.wcpe.mc,top.wcpe.loom,top.wcpe.loom-companion,top.wcpe.loom-no-remap,top.wcpe.loom-remap,top.wcpe.loom-repositories,dev.architectury
