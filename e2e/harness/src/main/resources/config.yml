# A 车道桩插件自身配置（非业务配置），由桩插件在 onEnable 时加载。
# 编排（mc-testkit Gradle 插件）在 prepare 阶段经环境变量把场景名与结果文件绝对路径下发到服务端进程；
# 桩优先读环境变量，本文件只在环境变量缺失时回退（如手工起服调试）。

# 本次要执行的场景 id（须与机器人侧 action、编排声明的场景名一致）：smoke（Paper）/ smoke-folia（Folia）。
scenario: "smoke"

# 结果文件路径（相对运行目录或绝对路径）。正常由编排经 MC_TESTKIT_E2E_RESULT_FILE 下发；
# 桩把 status/message 写到这里，编排的 verify 任务**只认这个文件**判 PASS/FAIL。
result-file: "e2e-result.properties"
