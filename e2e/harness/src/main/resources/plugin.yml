# MPMT A 车道桩插件描述。由真实 Paper/Folia 服务端在 E2E 运行时加载。
# 协议胶水来自共享构件 harness-core（基类 McTestkitHarnessPlugin），本插件只写业务场景。

# 插件名（出现在 /plugins 列表、日志、依赖声明里）
name: McTestkitE2eHarness
# 插件主类（Kotlin 实现，继承 harness-core 的 McTestkitHarnessPlugin）
main: com.example.e2e.McTestkitE2eHarnessPlugin
# 插件版本：构建期经 processResources 由根目录 VERSION 展开，勿手写第二份版本号
version: '${version}'
# 刻意不声明 api-version（harness-core 官方契约）：声明 1.20 会拒载旧版服务端，声明 1.8 又会被 1.20+ 拒绝；
# 不写则 1.13+ 按 legacy 插件加载。
# 声明支持 Folia（区域化线程）：否则 Folia 拒绝加载本插件（「not marked as supporting Folia」）；
# 调度兼容（GlobalRegionScheduler）由 harness-core 基类处理。
folia-supported: true
# 依赖被测产品插件（platform/bukkit 的 plugin.yml name），保证加载顺序
depend:
  - MultiPlatformModTemplate
