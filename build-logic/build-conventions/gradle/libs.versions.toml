# 本插件工程的版本目录。
#
# 这是**独立 included build**（见父仓 settings.gradle.kts 的 includeBuild），有自已的构建生命周期；
# 目录与 id 不含模板身份（ADR-0027），故不跨目录引用父仓的 gradle/libs.versions.toml——
# 那样会把「可独立复用」变成「必须放在某个特定位置」，换名/搬目录即断。
# 这里只列本插件工程用到的依赖，与父仓那份同名不共真源。

[versions]
ktlint-gradle = "14.2.0"
detekt = "2.0.0-alpha.6"
spotbugs-gradle-plugin = "6.0.26"
junit = "5.14.4"

[libraries]
# 仅编译期引用 SpotBugs 类型：运行期由消费方根构建提供同一份插件类路径
spotbugs-gradle-plugin = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "spotbugs-gradle-plugin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

[plugins]
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
