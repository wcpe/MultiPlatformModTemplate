# MPMT Bukkit 家族插件描述（Bukkit/Spigot/Paper/Folia 通用，单一构建经 FeatureGate 适配差异）
# 由 Bukkit 家族服务端加载；字段为 Bukkit 框架强制约定。
name: MultiPlatformModTemplate
version: ${version}
main: top.wcpe.mc.mpmt.platform.bukkit.MpmtBukkitPlugin
# 目标 API 版本（锚点 1.20.1）
api-version: '1.20'
# 声明支持 Folia 区域调度（运行期经 FeatureGate 适配，ADR-0007）
folia-supported: true
description: 多平台 mod 玩法脚手架 —— Bukkit 家族平台胶水
commands:
  mpmt:
    description: MPMT 管理命令
    usage: /mpmt machinecode ban <code> [reason...] | unban <code> | list
    permission: mpmt.machinecode.manage
permissions:
  mpmt.machinecode.manage:
    description: 管理机器码封禁
    default: op
