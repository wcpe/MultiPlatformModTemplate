import dev.architectury.pack200.java.Pack200Adapter

import net.fabricmc.loom.task.RemapJarTask

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // legacy forge 的 binpatches.pack.lzma 解包需要 Pack200 实现（JDK 14+ 已移除 java.util.jar.Pack200）；
        // 必须进 buildscript classpath，供下方 loom.forge.pack200Provider 实例化
        classpath 'dev.architectury:architectury-pack200:0.1.3'
    }
}

plugins {
    id 'java'
    id 'top.wcpe.loom'
}

// 本工程为根构建的普通子模块（platform/forge/1.12.2）；group / version 由根 allprojects 统一提供。
// 已由 ForgeGradle 3 / Gradle 5.6.4 迁移到 top.wcpe.loom（architectury-loom fork）+ 根统一 Gradle 9.6.1：
// 守护 JVM 须 ≥21（loom 运行期要求），目标 Java 8 由下方 toolchain 承担，不再做配置期 Gradle/Java 版本守卫。

base {
    archivesName = 'mpmt-forge-1.12.2'
}

java {
    toolchain {
        // 1.12.2 产品、共享 JAR 与 Forge 全链均为 Java 8 字节码；编译与契约测试运行都由该 toolchain 供给
        languageVersion = JavaLanguageVersion.of(8)
    }
}

ext {
    minecraftVersion = '1.12.2'
    forgeVersion = '1.12.2-14.23.5.2860'
    mappingsVersion = '20171003-1.12'
    productChannel = 'MPMT'
    acceptanceChannel = 'MPMTTEST'
}

// 共享模块已为根构建子模块：按工程路径取各模块 jar 任务产物（FileCollection，自带任务依赖）
def moduleJar = { String projectPath ->
    files(project(projectPath).tasks.withType(org.gradle.jvm.tasks.Jar).matching { it.name == 'jar' })
}

// 共享模块（L0-L2）项目路径；acceptance 仅进验收伴侣，不进产品
def productSharedProjects = [':core:domain', ':core:runtime', ':core:client', ':core:protocol']
def acceptanceSharedProjects = productSharedProjects + [':modules:acceptance']

configurations {
    productBundle
    acceptanceBundle
}

sourceSets {
    main {
        // 1.12 产品以 client 为主；common + client 分目录
        java.srcDirs = ['common/src/main/java', 'client/src/main/java']
        resources.srcDirs = ['common/src/main/resources', 'src/main/resources']
    }
    // 纯 JVM 单元测试源集（JaCoCo 覆盖率门禁的 test 任务输入）。
    // 编译期继承 main 类路径（含 loom 的 MCP 命名 Minecraft/Forge），故测试源码用 MCP 名。
    test {
        java.srcDir 'src/test/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.output
    }
    acceptance {
        java.srcDir 'src/acceptance/java'
        resources.srcDir 'src/acceptance/resources'
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    contractTest {
        java.srcDir 'src/contractTest/java'
        resources.srcDir 'src/contractTest/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + sourceSets.acceptance.output + sourceSets.acceptance.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath + sourceSets.acceptance.runtimeClasspath
    }
}

// ── forge 本地镜像（userdev shim）────────────────────────────────────────────
// arch-loom 的 ForgeProvider 硬编码按 :userdev classifier 请求 forge userdev 包（dep+":userdev"），
// 而 Forge 1.12.2-14.23.5.x 只发布 userdev3（FG2.3 过渡格式，仅早期 14.23.0.x 有 userdev）。
// 且 Gradle 对 POM 命中的仓库做 artifact 绑定（其余仓库/artifactUrls 均不参与，已实测），
// 因此这里在配置期把 loom 需要的 forge 产物完整镜像进 build/ 下的本地仓库（clean 即清）。
// 另有两处必须干预：
// 1) :userdev ← userdev3 内容；
// 2) loom 以 userdev config.json 是否含 "mcp" 键判定 legacy/modern（ForgeUserdevProvider），
//    userdev3 带 mcp_config 键会被误判 modern（modern mappings 管线请求不存在的 fabric intermediary），
//    故镜像时移除该键，强制走 legacy 管线（与 14.23.0.x 的 FG2 userdev 同为 legacy 语义）。
// 所有下载文件做 sha256 校验防半截/漂移。
// TODO(契约 7 不适用)：本段"配置期下载 + 写盘"经复核**无法**改为任务或惰性 Provider。arch-loom
//（top.wcpe.loom / CompileConfiguration#run → GradleUtils.afterSuccessfulEvaluation → setupMinecraft
// → DependencyProviders#handleDependencies → ForgeUserdevProvider#provide → DependencyInfo#resolveFile）
// 在**配置期**（afterEvaluate）就解析 forge 依赖；任务级 dependsOn 一律晚于该时点，冷缓存下配置阶段必失败。
// 故保留配置期镜像；下载已按文件存在性短路（命中即不重下）。
def forgeMirrorSpecs = [
    // [本地文件名, 远程文件名, sha256, 是否重写为 FG2 形态]
    // userdev 必须最后处理：其重写过程要复用已镜像的 sources jar
    ['forge-1.12.2-14.23.5.2860-universal.jar', 'forge-1.12.2-14.23.5.2860-universal.jar',
     'cd3fbf85d7ca744507fd6a37a41b90122d43e616a4f8962332b1b658655e8a64', false],
    ['forge-1.12.2-14.23.5.2860-installer.jar', 'forge-1.12.2-14.23.5.2860-installer.jar',
     'ea7c33ba95e3993a98d0e9e38168c0759ec323a18675a71d938e1f3f70e6e8e7', false],
    ['forge-1.12.2-14.23.5.2860-sources.jar', 'forge-1.12.2-14.23.5.2860-sources.jar',
     '52c1f22b56a936d62108d6c0d752c8ccd9cea90bdd190f3e344d6b0c698a4f57', false],
    ['forge-1.12.2-14.23.5.2860-userdev.jar', 'forge-1.12.2-14.23.5.2860-userdev3.jar',
     '9040f8f95d7296eb2f4ae9dd638021b6af43cedfa1ca4d30a2beae5491e9f3e2', true],
]
def userdevShimRoot = file("${layout.buildDirectory.get().asFile}/forge-userdev-shim")
def userdevShimDir = file("${userdevShimRoot}/net/minecraftforge/forge/${forgeVersion}")
forgeMirrorSpecs.each { spec ->
    def localName = spec[0]
    def remoteName = spec[1]
    def expectedSha = spec[2]
    def stripMcpKey = spec[3]
    def target = new File(userdevShimDir, localName)
    if (!target.isFile() || target.length() == 0) {
        userdevShimDir.mkdirs()
        logger.lifecycle("[forge-mirror] 下载 ${remoteName} → ${localName}")
        def source = new URL("https://maven.minecraftforge.net/net/minecraftforge/forge/${forgeVersion}/${remoteName}")
        def downloaded = new File(userdevShimDir, localName + '.downloading')
        source.withInputStream { input ->
            downloaded.withOutputStream { output -> output << input }
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
            .digest(downloaded.bytes)
            .collect { String.format('%02x', it) }.join()
        if (digest != expectedSha) {
            downloaded.delete()
            throw new GradleException("forge 镜像下载 sha256 校验失败（${localName}，实际 ${digest}）")
        }
        if (stripMcpKey) {
            // 重写 userdev jar 为 FG2 形态（loom legacy 分支的期待，结构对照 14.23.0.x 的 FG2 userdev）：
            // 1) config.json 整体替换为 FG2 结构（inheritsFrom 供 legacy 分支拼 de.oceanlabs.mcp:mcp:<v>:srg@zip；
            //    libraries 为 {name,url,children} 对象数组供 createLegacyLibs 读取；绝不能含 "mcp" 键——
            //    loom 以 config.json 是否含该键判定 legacy/modern，userdev3 原样会被误判 modern）
            // 2) jar 根补 merged_at.cfg（createLegacyAts 硬编码，内容取自 ats/forge_at.cfg）
            // FG2 结构的 config.json 内容：
            // - inheritsFrom 供 legacy 分支拼 de.oceanlabs.mcp:mcp:<v>:srg@zip
            // - libraries 用 {name} 对象数组供 createLegacyLibs 读取
            // - libraries 仅保留 mavenCentral 可解析的构建/验证核心库：1.12.2 客户端完整运行库
            //   （scala/akka 等，mavenCentral 已清理下架）只有 runClient 需要，本车道不实跑客户端
            //   （CatServer 生产自带），严禁在 JSON 里写注释（Gson 严格模式）
            def legacyDevJson = """
{
  "id": "@minecraft_version@-@project@@version@",
  "type": "release",
  "inheritsFrom": "1.12.2",
  "minecraftArguments": "--version FML_DEV --tweakClass net.minecraftforge.fml.common.launcher.FMLTweaker",
  "libraries": [
    {"name": "net.minecraft:launchwrapper:1.12"},
    {"name": "org.ow2.asm:asm-debug-all:5.2"},
    {"name": "lzma:lzma:0.0.1"},
    {"name": "net.sf.jopt-simple:jopt-simple:5.0.3"},
    {"name": "org.apache.maven:maven-artifact:3.5.3"},
    {"name": "org.apache.logging.log4j:log4j-api:2.15.0"},
    {"name": "org.apache.logging.log4j:log4j-core:2.15.0"}
  ]
}
"""
            def zout = new java.util.zip.ZipOutputStream(new FileOutputStream(target))
            def zin = new java.util.zip.ZipInputStream(new FileInputStream(downloaded))
            byte[] atBytes = null
            def entry
            while ((entry = zin.nextEntry) != null) {
                if (entry.name == 'config.json') {
                    // spec2 config.json → FG2 结构
                    zout.putNextEntry(new java.util.zip.ZipEntry('config.json'))
                    zout << legacyDevJson.getBytes('UTF-8')
                    zout.closeEntry()
                } else {
                    zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    if (!entry.directory) {
                        def bytes = zin.readAllBytes()
                        if (entry.name == 'ats/forge_at.cfg') {
                            atBytes = bytes
                        }
                        zout << bytes
                    }
                    zout.closeEntry()
                }
            }
            if (atBytes != null) {
                zout.putNextEntry(new java.util.zip.ZipEntry('merged_at.cfg'))
                zout << atBytes
                zout.closeEntry()
            }
            // FG2 形态还要求 jar 内有 sources.zip（createLegacySources 会把它拷进 source-repo 本地 maven 仓库）；
            // userdev3 的 sources 是远程 sources classifier，直接复用已镜像的 sources jar 内容
            def sourcesFile = new File(userdevShimDir, "forge-${forgeVersion}-sources.jar")
            if (sourcesFile.isFile()) {
                zout.putNextEntry(new java.util.zip.ZipEntry('sources.zip'))
                sourcesFile.withInputStream { zout << it.bytes }
                zout.closeEntry()
            }
            zin.close()
            zout.close()
            downloaded.delete()
        } else {
            if (!downloaded.renameTo(target)) {
                throw new GradleException("forge 镜像文件就位失败：${downloaded} → ${target}")
            }
        }
    }
}
// 最小 POM：让 shim 成为该 module 的元数据源——Gradle 把 artifact 查找绑定到 POM 所在仓库，
// 仅在远程仓库前置镜像文件是无法参与解析的（已实测）。
def userdevShimPom = new File(userdevShimDir, "forge-${forgeVersion}.pom")
if (!userdevShimPom.isFile()) {
    userdevShimPom.text = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0">
  <modelVersion>4.0.0</modelVersion>
  <groupId>net.minecraftforge</groupId>
  <artifactId>forge</artifactId>
  <version>${forgeVersion}</version>
  <packaging>jar</packaging>
</project>
"""
}

repositories {
    // 本地 shim：承载 forge module 的 POM 与全部 loom 所需产物（见上方说明）。
    // 注意：loom 在 apply 时已注入自己的 "Forge" 远程仓库（content 过滤 FORGE_GROUPS），
    // POM 在其命中即绑定该仓库、其余仓库不再参与；故必须把 shim 重排到仓库列表最前（见下）。
    maven {
        name = 'ForgeUserdevShim'
        url = uri(userdevShimRoot.toURI())
        content { includeModule('net.minecraftforge', 'forge') }
    }
    mavenCentral()
    // 无 POM 的 zip/jar 产物（MCP 映射数据 de.oceanlabs.mcp、Forge 托管的 scala-continuations _mc 版本）
    // 在 Forge maven 上只有 artifact 没有 POM，loom 注入的 Forge 仓库只查 mavenPom 会 miss；
    // 这里以 artifact-only 方式解析这些 group。
    maven {
        name = 'MinecraftForgeArtifactOnly'
        url = uri('https://maven.minecraftforge.net/')
        metadataSources { artifact() }
        content {
            includeGroup('de.oceanlabs.mcp')
            includeGroup('org.scala-lang.plugins')
        }
    }
}
// 把 shim 重排到仓库列表最前（loom 的 Forge 仓库在 apply 阶段已插入列表头部，
// 后声明的 shim 若不重排则永远轮不到）
def forgeUserdevShim = repositories.getByName('ForgeUserdevShim')
repositories.remove(forgeUserdevShim)
repositories.add(0, forgeUserdevShim)

dependencies {
    // arch-loom 三段式声明（替代 FG 的 minecraft{mappings{runs}} 单块）：
    // 原版 MC 本体 + MCP snapshot 映射（1.12.2 无 Mojang 官方映射，沿用原 snapshot_20171003-1.12）
    // + Forge（arch-loom 自行解析 userdev / binpatches / SRG 数据）
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    // MCP snapshot 映射为 zip 产物（无 POM），@zip 指定扩展名，配合上方 artifact-only 仓库解析
    mappings "de.oceanlabs.mcp:mcp_snapshot:${mappingsVersion}@zip"
    forge "net.minecraftforge:forge:${forgeVersion}"

    implementation files(productSharedProjects.collect { moduleJar(it) })
    productBundle files(productSharedProjects.collect { moduleJar(it) })

    // 纯 JVM 单元测试：JUnit 5（BOM 统一版本，与其它车道同源）。
    // 被测类为 Java 8 字节码，测试同样以 Java 8 语法编译 / 运行（toolchain 已固定 8）。
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    acceptanceImplementation files(acceptanceSharedProjects.collect { moduleJar(it) })
    acceptanceBundle files(moduleJar(':modules:acceptance'))
}

// test 源集用 JUnit Platform（与其它车道一致）
tasks.named('test', Test) {
    useJUnitPlatform()
}

loom {
    forge {
        // legacy forge（1.12.2）binpatches 为 pack200+lzma 打包，需要外部 Pack200 实现
        pack200Provider.set(new Pack200Adapter())
    }
    runs {
        // FG3 runs.client 等价移植：工作目录/系统属性/mod 源集逐项对齐；
        // legacy forge（LaunchWrapper tweakClass）的启动装配由 arch-loom 运行模板自动完成
        client {
            runDir 'run-client'
            property 'forge.logging.console.level', 'info'
            // HYBRID CatServer 自连地址；可 -Dmpmt.acceptance.server=host:port 覆盖
            property 'mpmt.acceptance.server', (project.findProperty('mpmt.acceptance.server') ?: '127.0.0.1:25568').toString()
            // 验收伴侣上报 ClientReady 用的 Java 可执行文件（runClient 执行期覆盖为 Java 8 launcher）
            property 'mpmt.acceptance.javaExecutable',
                System.getProperty('java.home') + File.separator + 'bin' + File.separator +
                    (System.getProperty('os.name', '').toLowerCase().contains('win') ? 'java.exe' : 'java')
            mods {
                mpmt {
                    sourceSet sourceSets.main
                }
                mpmt_acceptance {
                    sourceSet sourceSets.acceptance
                }
            }
        }
    }
}

def generatedBuildInfo = layout.buildDirectory.file('generated/sources/buildInfo/top/wcpe/mc/mpmt/platform/forge/ForgeBuildInfo.java').get().asFile
def generateBuildInfo = tasks.register('generateBuildInfo') {
    inputs.property 'version', project.version
    outputs.file generatedBuildInfo
    doLast {
        generatedBuildInfo.parentFile.mkdirs()
        generatedBuildInfo.setText(
            "package top.wcpe.mc.mpmt.platform.forge;\n\n" +
                "public final class ForgeBuildInfo {\n" +
                "    public static final String VERSION = \"${project.version}\";\n" +
                "    private ForgeBuildInfo() { }\n" +
                "}\n",
            'UTF-8')
    }
}
sourceSets.main.java.srcDir file("${layout.buildDirectory.get().asFile}/generated/sources/buildInfo")
compileJava.dependsOn generateBuildInfo

processResources {
    // Gradle 9 默认对重复条目报错（FG5 时代默认放行）；同名资源内容一致，保留先到者
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand version: project.version
    }
}

processAcceptanceResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all']
}

def archiveExcludes = [
    'META-INF/*.SF',
    'META-INF/*.DSA',
    'META-INF/*.RSA',
    'META-INF/MANIFEST.MF',
    'META-INF/maven/**'
]

tasks.named('jar', Jar) {
    // loom 约定：jar 产物改落 build/devlibs 且带 -dev 分类器；
    // build/libs 下的正式产品名（无分类器）由 remapJar 以生产命名输出（见 reobfJar 兼容层）
    from {
        configurations.productBundle.collect { zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveExcludes.each { exclude it }
    exclude 'top/wcpe/mc/mpmt/acceptance/**'
    exclude 'top/wcpe/mc/mpmt/platform/forge/acceptance/**'
    manifest {
        attributes 'Implementation-Title': 'MPMT Forge 1.12.2 客户端产品',
            'Implementation-Version': project.version,
            'FMLAT': ''
    }
}

def acceptanceJar = tasks.register('acceptanceJar', Jar) {
    group = 'build'
    description = '构建独立 client-only 1.12.2 验收伴侣 JAR（dev/MCP 命名中间产物）'
    archiveBaseName = 'mpmt-forge-acceptance-1.12.2'
    archiveVersion = project.version.toString()
    // loom 约定：dev 产物落 devlibs，避免与 build/libs 下 remapAcceptanceJar 的正式产物重名
    destinationDirectory = layout.buildDirectory.dir('devlibs')
    from sourceSets.acceptance.output
    from {
        configurations.acceptanceBundle.collect { zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveExcludes.each { exclude it }
    exclude 'top/wcpe/mc/mpmt/core/**'
    exclude 'top/wcpe/mc/mpmt/protocol/**'
    exclude 'top/wcpe/mc/mpmt/platform/forge/MpmtForgeMod.class'
    exclude 'top/wcpe/mc/mpmt/platform/forge/ForgeBuildInfo.class'
    exclude 'top/wcpe/mc/mpmt/platform/forge/client/**'
    exclude 'top/wcpe/mc/mpmt/platform/forge/hud/**'
    exclude 'top/wcpe/mc/mpmt/platform/forge/net/**'
    manifest {
        attributes 'Implementation-Title': 'MPMT Forge 1.12.2 客户端验收伴侣',
            'Implementation-Version': project.version
    }
}

// 验收伴侣生产产物：named(MCP) → srg 重映射（等价原 FG reobfAcceptanceJar），
// 输出保持 build/libs/mpmt-forge-acceptance-1.12.2-<version>.jar（根文档/契约既有预期）
def remapAcceptanceJar = tasks.register('remapAcceptanceJar', RemapJarTask) {
    group = 'build'
    description = '将验收伴侣重映射到生产命名（srg），等价原 FG reobfAcceptanceJar'
    dependsOn acceptanceJar
    input.set(acceptanceJar.flatMap { it.archiveFile })
    classpath = sourceSets.acceptance.runtimeClasspath
    archiveBaseName = 'mpmt-forge-acceptance-1.12.2'
    archiveVersion = project.version.toString()
    archiveClassifier = ''
}

// FG 时代 reobf 产物路径/任务名兼容层（根文件契约不可断）：
// - 根 :collectReleaseArtifacts 的 ReleaseArtifact 硬引用 platform/forge/1.12.2/build/reobfJar/output.jar
// - 根 realserver 说明沿用 `gradlew reobfJar reobfAcceptanceJar` 命令与产物路径
// arch-loom 下重映射由 remapJar / remapAcceptanceJar 产出，这里同步到既有路径。
def reobfJar = tasks.register('reobfJar', Copy) {
    group = 'build'
    description = '同步 remapJar 产物到 build/reobfJar/output.jar（根门禁 ReleaseArtifact 既有路径）'
    dependsOn tasks.named('remapJar', RemapJarTask)
    from tasks.named('remapJar', RemapJarTask).flatMap { it.archiveFile }
    into layout.buildDirectory.dir('reobfJar')
    rename { 'output.jar' }
}

def reobfAcceptanceJar = tasks.register('reobfAcceptanceJar', Copy) {
    group = 'build'
    description = '同步 remapAcceptanceJar 产物到 build/reobfAcceptanceJar/output.jar（client-companion 既有首选路径）'
    dependsOn remapAcceptanceJar
    from remapAcceptanceJar.flatMap { it.archiveFile }
    into layout.buildDirectory.dir('reobfAcceptanceJar')
    rename { 'output.jar' }
}

/**
 * 将 client-only 产品 + 验收伴侣拷到 build/client-companion/，供 CatServer（HYBRID 矩阵）手工/编排消费。
 * 禁止作为服务端 mods 装入 CatServer。
 */
def prepareClientCompanionArtifacts = tasks.register('prepareClientCompanionArtifacts') {
    group = 'build'
    description = '拷贝 Forge 1.12.2 client-only 产品/验收 jar 到 build/client-companion/（供 CatServer（HYBRID 矩阵））'
    dependsOn reobfJar, reobfAcceptanceJar
    doLast {
        File outDir = layout.buildDirectory.dir('client-companion').get().asFile
        outDir.mkdirs()
        File product = file("${layout.buildDirectory.get().asFile}/reobfJar/output.jar")
        File acceptanceReobf = file("${layout.buildDirectory.get().asFile}/reobfAcceptanceJar/output.jar")
        if (!product.isFile()) {
            throw new GradleException("缺少 reobf 产品 jar：${product}")
        }
        // 优先 reobfAcceptanceJar 兼容路径，否则 libs 中的验收 remap 产物
        File acceptance = acceptanceReobf.isFile() ? acceptanceReobf : remapAcceptanceJar.get().archiveFile.get().asFile
        if (!acceptance.isFile()) {
            throw new GradleException("缺少验收伴侣 jar：${acceptance}")
        }
        copy {
            from product
            into outDir
            rename { "mpmt-forge-1.12.2-${project.version}.jar" }
        }
        copy {
            from acceptance
            into outDir
            rename { "mpmt-forge-acceptance-1.12.2-${project.version}.jar" }
        }
        logger.lifecycle("[client-companion] ${outDir.absolutePath}")
        logger.lifecycle('[client-companion] 注意：client-only，禁止装入 CatServer mods/；HYBRID 客户端伴侣用')
    }
}

compileAcceptanceJava.dependsOn classes
compileContractTestJava.dependsOn acceptanceClasses

def java8Launcher = javaToolchains.launcherFor {
    // 1.12.2 客户端/契约测试须 Java 8 运行；守护 JVM（≥21）与之解耦
    languageVersion = JavaLanguageVersion.of(8)
}

def contractTest = tasks.register('contractTest', JavaExec) {
    group = 'verification'
    description = '运行 1.12.2 构建、握手、wire 与双 JAR 隔离契约测试'
    dependsOn tasks.named('remapJar', RemapJarTask), remapAcceptanceJar, contractTestClasses
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = 'top.wcpe.mc.mpmt.platform.forge.contract.Forge112ContractTest'
    javaLauncher = java8Launcher
    systemProperty 'mpmt.test.repositoryRoot', rootProject.projectDir.absolutePath
    systemProperty 'mpmt.test.productJar', tasks.named('remapJar', RemapJarTask).flatMap { it.archiveFile }.get().asFile.absolutePath
    systemProperty 'mpmt.test.acceptanceJar', remapAcceptanceJar.flatMap { it.archiveFile }.get().asFile.absolutePath
    systemProperty 'mpmt.test.version', project.version.toString()
}

// runClient 逐项等价原 FG3 client run：除 runDir/系统属性外，1.12.2 客户端本体只能在 Java 8 上启动
tasks.matching { it.name == 'runClient' }.configureEach {
    if (it instanceof JavaExec) {
        it.javaLauncher = java8Launcher
        it.doFirst {
            it.systemProperty 'mpmt.acceptance.javaExecutable', java8Launcher.get().executablePath.asFile.absolutePath
        }
    }
}

check.dependsOn contractTest
// build 须同时产出生产验收 jar 与根门禁/文档既有的 reobf* 兼容路径（产品 remapJar 由 assemble 链触发）
build.dependsOn remapAcceptanceJar, reobfJar, reobfAcceptanceJar

clean.doFirst {
    delete project.file('run-client')
}
