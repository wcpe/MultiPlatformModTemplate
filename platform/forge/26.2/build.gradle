def requiredRunProperty = { String name ->
    Object value = project.findProperty(name)
    if (value == null || value.toString().isEmpty()) {
        throw new GradleException("缺少运行属性 -P${name}")
    }
    return value.toString()
}

def configureReportProperties = { task ->
    File product = tasks.named('jar', Jar).get().archiveFile.get().asFile
    File acceptance = acceptanceJar.get().archiveFile.get().asFile
    // server-runtime 与其余角色同口径（镜像 fabric 26.2 的 artifactOrProduct）：
    // 显式传入时必须是真实文件（真实专用服路径），未传入则回落产品 jar——dev 编排起的是 loom dev 服务端，
    // 其"运行期制品"即产品 jar；否则 dev 编排会被迫依赖一个不存在的外部服务端 jar。
    Object serverRuntimeProperty = project.findProperty('mpmt.acceptance.artifact.server-runtime')
    File serverRuntime = serverRuntimeProperty == null || serverRuntimeProperty.toString().isEmpty()
            ? product
            : file(serverRuntimeProperty.toString())
    if (!serverRuntime.isFile()) {
        throw new GradleException("server-runtime 必须是调用方显式提供的实际文件：${serverRuntime}")
    }
    task.systemProperty 'mpmt.acceptance.runId', requiredRunProperty('mpmt.acceptance.runId')
    task.systemProperty 'mpmt.acceptance.matrix', requiredRunProperty('mpmt.acceptance.matrix')
    task.systemProperty 'mpmt.acceptance.startEpochMs', requiredRunProperty('mpmt.acceptance.startEpochMs')
    task.systemProperty 'mpmt.acceptance.javaExecutable', java25Launcher.get().executablePath.asFile.absolutePath
    task.systemProperty 'mpmt.acceptance.artifact.server-runtime', serverRuntime.absolutePath
    task.systemProperty 'mpmt.acceptance.artifact.server-product', product.absolutePath
    task.systemProperty 'mpmt.acceptance.artifact.server-acceptance', acceptance.absolutePath
    task.systemProperty 'mpmt.acceptance.artifact.client-product', (project.findProperty('mpmt.acceptance.artifact.client-product') ?: product.absolutePath).toString()
    task.systemProperty 'mpmt.acceptance.artifact.client-acceptance', (project.findProperty('mpmt.acceptance.artifact.client-acceptance') ?: acceptance.absolutePath).toString()
}

def installDevAcceptanceMod = { File runDir ->
    File modsDir = new File(runDir, 'mods')
    fileTree(modsDir) {
        include 'mpmt-*.jar'
    }.files.each { File candidate ->
        if (!candidate.delete()) {
            throw new GradleException("无法删除旧版 MPMT 验收 JAR：${candidate}")
        }
    }
    copy {
        from acceptanceJar.flatMap { it.archiveFile }
        into modsDir
    }
}

def prepareAcceptanceServerProperties = { File runDir ->
    File propertiesFile = new File(runDir, 'server.properties')
    Map<String, String> offlineProperties = [
            'online-mode': 'false',
            'enforce-secure-profile': 'false'
    ]
    List<String> lines = propertiesFile.isFile()
            ? propertiesFile.readLines('UTF-8')
            : []
    Set<String> updatedKeys = [] as Set
    List<String> updatedLines = lines.collect { String line ->
        int separator = line.indexOf('=')
        String key = separator > 0 ? line.substring(0, separator) : ''
        if (offlineProperties.containsKey(key)) {
            updatedKeys.add(key)
            return "${key}=${offlineProperties.get(key)}"
        }
        return line
    }
    offlineProperties.each { String key, String value ->
        if (!updatedKeys.contains(key)) {
            updatedLines.add("${key}=${value}")
        }
    }
    runDir.mkdirs()
    propertiesFile.setText(updatedLines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
}

tasks.matching { it.name == 'runAcceptanceServer' }.configureEach {
    // packageArtifacts 供报告属性取 jar 路径；prepareDevModOutputs 供 MOD_CLASSES 实际加载
    dependsOn packageArtifacts, prepareDevModOutputs
    if (it instanceof JavaExec) {
        it.javaLauncher = java25Launcher
        it.doFirst {
            File runDir = project.file(acceptanceServerRunDirectory)
            if (realServerHostRequested) {
                new File(runDir, 'eula.txt').setText('eula=true\n', 'UTF-8')
            }
            prepareAcceptanceServerProperties(runDir)
            installDevAcceptanceMod(runDir)
            configureReportProperties(it)
            File mainDir = sourceSets.main.java.destinationDirectory.get().asFile
            File acceptanceDir = sourceSets.acceptance.java.destinationDirectory.get().asFile
            File mainToml = new File(mainDir, 'META-INF/mods.toml')
            File acceptanceToml = new File(acceptanceDir, 'META-INF/mods.toml')
            File mainModClass = new File(mainDir, 'top/wcpe/mc/mpmt/platform/forge/modern/MpmtForge262Mod.class')
            File acceptanceModClass = new File(acceptanceDir, 'top/wcpe/mc/mpmt/platform/forge/modern/acceptance/MpmtForge262AcceptanceMod.class')
            File coreClass = new File(mainDir, 'top/wcpe/mc/mpmt/core/runtime/MpmtRuntime.class')
            if (!mainToml.isFile() || !mainModClass.isFile() || !coreClass.isFile()) {
                throw new GradleException("dev 产品 SecureJar 目录不完整：${mainDir}")
            }
            if (!acceptanceToml.isFile() || !acceptanceModClass.isFile()) {
                throw new GradleException("dev 验收 SecureJar 目录不完整：${acceptanceDir}")
            }
        }
    }
}

tasks.matching { it.name == 'runAcceptanceClient' }.configureEach {
    dependsOn packageArtifacts, prepareDevModOutputs
    if (it instanceof JavaExec) {
        it.javaLauncher = java25Launcher
        it.doFirst {
            installDevAcceptanceMod(project.file('run-acceptance-client'))
            it.systemProperty 'mpmt.acceptance.javaExecutable', java25Launcher.get().executablePath.asFile.absolutePath
            // 伴侣自动连服地址（含端口）；缺省与 quickPlay 一致
            it.systemProperty 'mpmt.acceptance.server', (project.findProperty('mpmt.acceptance.server') ?: '127.0.0.1').toString()
        }
    }
}

def forge262ReportFile = {
    def custom = project.findProperty('mpmt.acceptance.report')
    if (custom != null && custom.toString().trim()) {
        return file(custom.toString())
    }
    def real = project.file('run-realserver/acceptance-report.txt')
    if (real.isFile()) {
        return real
    }
    return project.file('run-acceptance-server/acceptance-report.txt')
}

tasks.register('verifyAcceptanceReport') {
    group = 'verification'
    description = '校验 Forge 26.2 真服/验收报告末行 RESULT PASS'
    doLast {
        File report = forge262ReportFile()
        if (!report.isFile()) {
            throw new GradleException(
                "未找到 Forge 26.2 验收报告：${report.absolutePath}\n" +
                    "先跑 runServer + runClient，或提供 server-runtime 后跑 runRealServerAcceptanceHost + 客户端伴侣。",
            )
        }
        def lines = report.readLines('UTF-8').collect { it.trim() }.findAll { it }
        if (lines.isEmpty()) {
            throw new GradleException("验收报告为空：${report.absolutePath}")
        }
        def last = lines.last()
        if (!last.startsWith('RESULT ')) {
            throw new GradleException("验收报告末行不是 RESULT 行：${report.absolutePath}\n$last")
        }
        if (last != 'RESULT PASS') {
            throw new GradleException(
                "验收未通过（$last）：${report.absolutePath}\n—— 报告全文 ——\n${report.getText('UTF-8')}",
            )
        }
        logger.lifecycle("[realserver] Forge 26.2 报告 PASS：${report.absolutePath}")
    }
}

/** 仅起真实 Forge 专用服（须 -Pmpmt.acceptance.artifact.server-runtime=…）；客户端请另开终端 runAcceptanceClient。 */
/** 单 Gradle 编排：起服 → 等端口 → 起客户端伴侣 → 等同轮报告（镜像 fabric lane 的 launchAcceptanceProcess 模式）。 */
tasks.register('runForgeRealServer262Acceptance') {
    group = 'verification'
    description = '单 Gradle 编排 Forge 26.2 REALSERVER262 服务端与客户端验收'
    // 同 fabric 26.2：本任务用 ProcessBuilder 直接拉起 run 任务命令行、绕过任务图，
    // 必须显式依赖 loom 的 generateDLIConfig（写出 dev-launch-injector 的 launch.cfg），
    // 否则 dev 启动不注入任何 mod、验收场景不执行 → 超时无报告。
    dependsOn packageArtifacts, prepareDevModOutputs, 'generateDLIConfig'
    doLast {
        def runId = requiredRunProperty('mpmt.acceptance.runId')
        requiredRunProperty('mpmt.acceptance.matrix')
        requiredRunProperty('mpmt.acceptance.startEpochMs')
        def report = file('run-acceptance-server/acceptance-report.txt')
        def logDir = new File(buildDir, 'acceptance-logs')
        logDir.mkdirs()

        // 编排模式下 run 任务的 doFirst 不会执行，这里等价执行其准备工作
        def serverTask = tasks.named('runAcceptanceServer', JavaExec).get()
        def clientTask = tasks.named('runAcceptanceClient', JavaExec).get()
        installDevAcceptanceMod(file('run-acceptance-server'))
        prepareAcceptanceServerProperties(file('run-acceptance-server'))
        configureReportProperties(serverTask)
        installDevAcceptanceMod(file('run-acceptance-client'))
        clientTask.systemProperty 'mpmt.acceptance.javaExecutable', java25Launcher.get().executablePath.asFile.absolutePath
        clientTask.systemProperty 'mpmt.acceptance.server',
                (project.findProperty('mpmt.acceptance.server') ?: '127.0.0.1:25566').toString()

        // 进程命令行复刻 gradle JavaExec 启动（镜像 fabric launchAcceptanceProcess）：
        // jvmArguments = @argfile（classpath）+ internal vmArgs（-Dfabric.dli.* 与全部 -D 属性）；
        // 本轮系统属性去重后重注，保证编排注入值覆盖 loom 配置期默认值
        def launchAcceptanceProcess = { JavaExec task, File logFile, File workDir ->
            def command = [task.javaLauncher.get().executablePath.asFile.absolutePath]
            def systemPropertyPrefixes = task.systemProperties.keySet().collect { "-D$it=" }
            // 必须用 allJvmArgs（镜像 fabric lane）：Windows 下长类路径由 Gradle 写成 argfile，
            // 该 @argfile 只出现在 allJvmArgs 里、不在 jvmArguments 中；漏掉它会导致 java 拿不到类路径，
            // 报 "找不到或无法加载主类 net.fabricmc.devlaunchinjector.Main"。
            command += task.allJvmArgs.findAll { arg ->
                arg != null && !systemPropertyPrefixes.any { arg.startsWith(it) }
            }
            command += task.systemProperties.collect { k, v -> "-D$k=$v" }
            command += task.mainClass.get()
            command += task.args
            task.argumentProviders.each { provider -> command += provider.asArguments().toList() }
            // ProcessBuilder(List<String>) 会做一次底层 arraycopy；执行期由 argumentProviders 惰性产出的
            // 参数可能不是 String（如 File / Path），此时抛 ArrayStoreException：
            // "arraycopy: element type mismatch ... to java.lang.String"。
            // 命令行元素统一按其字符串形式归一，并打印非 String 元素类型以便定位。
            def nonStringTypes = command.findAll { it != null && !(it instanceof String) }
                    .collect { it.getClass().name }.unique()
            if (!nonStringTypes.isEmpty()) {
                logger.lifecycle("[realserver] ${task.name} 命令行含非 String 参数，已按字符串归一：${nonStringTypes}")
            }
            command = command.findAll { it != null }.collect { it.toString() }
            logger.lifecycle("[realserver] 启动 ${task.name}…")
            logFile.parentFile.mkdirs()
            return new ProcessBuilder(command)
                .directory(workDir)
                .redirectErrorStream(true)
                .redirectOutput(logFile)
                .start()
        }

        def server = null
        def client = null
        try {
            // ① 起 dev 服务端
            server = launchAcceptanceProcess(serverTask, new File(logDir, 'realserver262-server.log'), file(acceptanceServerRunDirectory))

            // ② 等服务端监听 25566（Java 25 冷启动窗口）
            def portDeadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(300)
            def portOpen = false
            while (System.nanoTime() < portDeadline) {
                if (!server.isAlive()) break
                try {
                    new Socket('127.0.0.1', 25566).close()
                    portOpen = true
                    break
                } catch (Exception ignored) {
                    Thread.sleep(500)
                }
            }
            if (!portOpen) {
                def tail = serverLogFile0(logDir)
                throw new GradleException("[realserver] 服务端未监听 25566：" + System.lineSeparator() + "$tail")
            }

            // ③ 起客户端伴侣（自连 127.0.0.1:25566；GUI 窗口在用户桌面，场景全自动）
            client = launchAcceptanceProcess(clientTask, new File(logDir, 'realserver262-client.log'), file('run-acceptance-client'))

            // ④ 等同轮报告（驱动看门狗 600s；此处留 660s 余量）
            def deadline = System.nanoTime() + TimeUnit.MILLISECONDS.toNanos(660_000)
            def reportLine = "RUN_ID" + "	" + "$runId"
            while (System.nanoTime() < deadline) {
                if (report.isFile() && report.getText('UTF-8').contains(reportLine)) break
                if (!server.isAlive() && !(report.isFile() && report.getText('UTF-8').contains(reportLine))) break
                Thread.sleep(500)
            }
            if (!report.isFile() || !report.getText('UTF-8').contains(reportLine)) {
                def tail = new File(logDir, 'realserver262-server.log').isFile()
                        ? new File(logDir, 'realserver262-server.log').readLines().takeRight(30).join(System.lineSeparator()) : ''
                throw new GradleException("[realserver] REALSERVER262 未在截止前生成当前运行报告（$runId）：${report.absolutePath}" + System.lineSeparator() + "$tail")
            }
            def lines = report.getText('UTF-8').readLines().collect { it.trim() }.findAll { it }
            def last = lines.last()
            if (last != 'RESULT PASS') {
                throw new GradleException("[realserver] 验收未通过（$last）：${report.absolutePath}")
            }
            logger.lifecycle("[realserver] Forge 26.2 REALSERVER262 报告 PASS：${report.absolutePath}")
        } finally {
            [client, server].each { proc ->
                if (proc != null && proc.isAlive()) {
                    proc.destroy()
                    if (!proc.waitFor(10, TimeUnit.SECONDS)) proc.destroyForcibly()
                }
            }
        }
    }
}

def serverLogFile0(File logDir) {
    def f = new File(logDir, 'realserver262-server.log')
    return f.isFile() ? f.readLines().takeRight(30).join(System.lineSeparator()) : '无服务端日志'
}

tasks.register('runRealServerAcceptanceHost') {
    group = 'verification'
    description = '通过 Forge runAcceptanceServer 启动真实专用服（不含客户端伴侣；不含报告门）'
    dependsOn tasks.named('runAcceptanceServer')
}

/** 报告门：须先完成「服 + 客户端伴侣」并落 RESULT PASS 报告。 */
tasks.register('runRealServerAcceptance') {
    group = 'verification'
    description =
        'Forge 26.2 realserver 门禁：校验权威报告 RESULT PASS（须先起服 + runClient）'
    dependsOn verifyAcceptanceReport
}

tasks.register('printRealServerAcceptanceRecipe') {
    group = 'help'
    description = '打印 Forge 26.2 真服验收推荐步骤（独立 launcher，禁止嵌套根 gradlew）'
    doLast {
        logger.lifecycle(
            """
            |[Forge 26.2 realserver]
            |1) 本目录构建产物：
            |   ./gradlew --no-daemon packageArtifacts
            |2) 起服（二选一）：
            |   a) dev 服：./gradlew --no-daemon runAcceptanceServer
            |   b) 真实专用服：./gradlew --no-daemon runRealServerAcceptanceHost \\
            |        -Pmpmt.acceptance.artifact.server-runtime=<forge-server.jar> \\
            |        -Pmpmt.acceptance.runId=... -Pmpmt.acceptance.matrix=... \\
            |        -Pmpmt.acceptance.startEpochMs=...
            |3) 另开终端客户端伴侣：
            |   ./gradlew --no-daemon runAcceptanceClient -Pmpmt.acceptance.server=127.0.0.1:<port>
            |4) 报告门：
            |   ./gradlew --no-daemon runRealServerAcceptance
            |   # 或 ./gradlew --no-daemon verifyAcceptanceReport
            """.stripMargin().trim(),
        )
    }
}

