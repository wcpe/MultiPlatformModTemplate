version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 一次最多同时开 5 个 PR：首轮扫描会把所有落后依赖一次全开，
    # 不限量会淹没 PR 列表，也让每个 PR 的 CI 重复跑全量构建。
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # core-domain 用 JDK 8 工具链编译（L0 严格 Java 8，见 ADR-0004），
      # 而 JUnit 6 要求 JVM 17+，升级必然导致 :buildAll 失败。
      # 待 L0 的 Java 8 契约调整前，锁在 JUnit 5。
      #
      # 必须同时锁 junit-bom 与 junit-jupiter：先前只锁了 bom，junit-jupiter
      # 仍被反复开成升级 PR（#21），而它引用的正是同一批 JUnit 6 制品。
      - dependency-name: "org.junit:junit-bom"
        versions: [">=6.0.0"]
      - dependency-name: "org.junit.jupiter:*"
        versions: [">=6.0.0"]
      - dependency-name: "org.junit.platform:*"
        versions: [">=6.0.0"]
      # MockBukkit 3.93.2 在仓库中不存在（实测 acceptanceTestCompileClasspath
      # 解析失败：Could not resolve com.github.seeseemelk:MockBukkit-v1.20:3.93.2）。
      # 锁到已确认可用的 3.88.x 线，等上游发布可用版本后再放开。
      - dependency-name: "com.github.seeseemelk:MockBukkit-v1.20"
        versions: [">3.88.1"]
      # foojay-resolver-convention 是 Gradle toolchain 解析插件，1.0.0 为
      # 跨主版本升级，需连同工具链配置一并评估，不适合自动跟进。
      - dependency-name: "org.gradle.toolchains.foojay-resolver-convention"
        update-types: ["version-update:semver-major"]
      # gson、snakeyaml 与 guava 按维护者决定压死，不跟随自动升级。
      #
      # gson：bukkit 26.2 车道显式钉住编译期版本（platform/bukkit/26.2/build.gradle.kts），
      # 该车道有冻结 API 快照 + SHA-256 校验，升级需连带复验编译面；且 #25 改的
      # gsonVersion 变量在域模块化重构后已不存在，该 PR 本身已无落点。
      # snakeyaml：Sponge 车道按 ADR-0012 把它 relocate 到 libs.* 后打进插件 jar，
      # 升级会改变产物内容，属需人工复验的变更。
      # guava：同样在 bukkit 26.2 车道显式钉住（该车道偏离 build-conventions 的默认
      # 依赖集），属 paper-api 编译面的一部分，升级需连冻结快照一并复验。
      - dependency-name: "com.google.code.gson:gson"
        versions: [">=0"]
      - dependency-name: "org.yaml:snakeyaml"
        versions: [">=0"]
      - dependency-name: "com.google.guava:guava"
        versions: [">=0"]
