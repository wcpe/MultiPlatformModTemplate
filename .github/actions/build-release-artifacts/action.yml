name: 构建全部发布车道
description: 在单一根构建内构建全部发布制品（ADR-0026）；mc-testkit 与 harness-core 直接解析远端 WCPE Releases

inputs:
  validate-template:
    description: 是否校验 E2E 模板
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # 根构建硬要求守护 JVM ≥ 25（26.2 两条车道的 loom 与车道脚本在配置期硬校验，ADR-0026 决策 4）。
    # 8/17/21 仅作为 toolchain 目标由 foojay 解析；此处显式安装以命中 CI 缓存、避免每次下载。
    - name: 安装 Java 8
      id: java8
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: "8"

    - name: 安装 Java 17
      id: java17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: "17"

    - name: 安装 Java 21
      id: java21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: "21"

    - name: 安装 Java 25（根构建守护 JVM）
      id: java25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: "25"

    - name: 配置 Gradle 缓存
      uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

    # 单一根构建：全部平台车道为根子模块，一条命令构建 + 校验 + 聚合发布产物。
    # JDK 25 守护（26.2 车道配置期硬校验）；MPMT_JAVA*_HOME 供矩阵轨与跨代车道显式选 JDK。
    - name: 根全量构建（全车道制品 + 发布产物结构门 + dist 聚合）
      shell: bash
      env:
        JAVA_HOME: ${{ steps.java25.outputs.path }}
        MPMT_JAVA8_HOME: ${{ steps.java8.outputs.path }}
        MPMT_JAVA17_HOME: ${{ steps.java17.outputs.path }}
        MPMT_JAVA21_HOME: ${{ steps.java21.outputs.path }}
        MPMT_JAVA25_HOME: ${{ steps.java25.outputs.path }}
      run: |
        ./gradlew "-Dfabric.loom.cache.dir=$GITHUB_WORKSPACE/.gradle/loom-user-cache" \
          --no-daemon --max-workers=1 --no-watch-fs --console=plain --stacktrace \
          :buildAll

    - name: 安装 Node 22
      if: inputs.validate-template == 'true'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: e2e/bot/package-lock.json

    # A 车道桩是根构建子模块（ADR-0026：无自有 wrapper / settings），故在仓库根以 JDK 25 守护构建。
    - name: 构建 E2E harness
      if: inputs.validate-template == 'true'
      shell: bash
      env:
        JAVA_HOME: ${{ steps.java25.outputs.path }}
        MPMT_JAVA8_HOME: ${{ steps.java8.outputs.path }}
        MPMT_JAVA17_HOME: ${{ steps.java17.outputs.path }}
        MPMT_JAVA21_HOME: ${{ steps.java21.outputs.path }}
        MPMT_JAVA25_HOME: ${{ steps.java25.outputs.path }}
      run: ./gradlew --no-daemon --max-workers=1 --no-watch-fs --console=plain :e2e:harness:build

    - name: 校验 E2E bot 模板
      if: inputs.validate-template == 'true'
      shell: bash
      working-directory: e2e/bot
      run: |
        npm ci
        npm run lint
        npx prettier --check .
