name: 构建全部发布车道
description: 在单一根构建内构建全部发布制品（ADR-0026）；mc-testkit 与 harness-core 直接解析远端 WCPE Releases

inputs:
  validate-template:
    description: 是否校验 E2E 模板
    required: false
    default: "true"
  disable-build-cache:
    description: 是否禁用 Gradle 构建缓存（CodeQL 需要真实编译才能提取源码）
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # 根构建硬要求守护 JVM ≥ 25（26.2 两条车道的 loom 与车道脚本在配置期硬校验，ADR-0026 决策 4）。
    # 8/17/21 仅作为 toolchain 目标由 foojay 解析；此处显式安装以命中 CI 缓存、避免每次下载。
    - name: 安装 Java 8
      id: java8
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: "8"

    - name: 安装 Java 17
      id: java17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: "17"

    - name: 安装 Java 21
      id: java21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: "21"

    - name: 安装 Java 25（根构建守护 JVM）
      id: java25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: "25"

    - name: 配置 Gradle 缓存
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

    # Loom 的 MC 映射 / dev jar（约数 GB）不在 setup-gradle 默认缓存范围内，
    # 每次冷启动都要重新派生，是 :buildAll 的主要固定开销。
    #
    # 只缓存 Loom 制品（映射与 dev jar），不动 setup-gradle 的 cache-read-only：
    # 本 action 也被 CodeQL 以 disable-build-cache=true 调用，若开启构建缓存写入/命中，
    # compileJava 会取缓存产物而不调用 javac，CodeQL 报 Exit 32。
    # CodeQL 路径跳过本步骤，避免与其 build-cache 策略相互干扰。
    #
    # ⚠ 缓存路径必须与下面 `-Dfabric.loom.cache.dir` 指向的目录**完全一致**。
    # 此前二者错位（缓存 ~/.gradle/caches/fabric-loom，构建读工作区内的
    # .gradle/loom-user-cache），导致恢复出来的映射与 dev jar 一次都用不上，
    # 每轮都要重新下载并派生 MC jar / mappings / patched jar——这是 :buildAll 耗时的大头。
    # 现统一到 ~/.gradle/caches/fabric-loom，并用同一个表达式生成构建参数，从结构上避免再次漂移。
    - name: 缓存 Loom 制品
      if: inputs.disable-build-cache != 'true'
      uses: actions/cache@v4
      with:
        # 只缓存 ~/.gradle 下的共享制品（MC jar / 映射 / dev jar）。
        # 不缓存工作区内的 .gradle/loom-user-cache：那是构建本身的工作目录，
        # 缓存其中间产物会让下游构建读到「文件在、内容不可用」的半成品，
        # 表现为 genSourcesWithCfr 报「Minecraft jar 尚不存在」而任务创建失败。
        path: ~/.gradle/caches/fabric-loom
        key: loom-${{ runner.os }}-all-${{ hashFiles('gradle.properties', 'platform/**/build.gradle.kts') }}
        restore-keys: |
          loom-${{ runner.os }}-all-
          loom-${{ runner.os }}-

    # 单一根构建：全部平台车道为根子模块，一条命令构建 + 校验 + 聚合发布产物。
    # JDK 25 守护（26.2 车道配置期硬校验）；MPMT_JAVA*_HOME 供矩阵轨与跨代车道显式选 JDK。
    #
    # disable-build-cache：CodeQL 靠追踪编译器调用提取源码，构建缓存命中会让
    # compileJava 直接取缓存产物（日志里的 FROM-CACHE）而不调用 javac，于是 CodeQL
    # 报 "this run didn't build any of it"（Exit 32）。故该场景下用 --no-build-cache
    # 覆盖 gradle.properties 的 org.gradle.caching=true，强制真实编译。
    - name: 根全量构建（全车道制品 + 发布产物结构门 + dist 聚合）
      shell: bash
      env:
        JAVA_HOME: ${{ steps.java25.outputs.path }}
        MPMT_JAVA8_HOME: ${{ steps.java8.outputs.path }}
        MPMT_JAVA17_HOME: ${{ steps.java17.outputs.path }}
        MPMT_JAVA21_HOME: ${{ steps.java21.outputs.path }}
        MPMT_JAVA25_HOME: ${{ steps.java25.outputs.path }}
        EXTRA_GRADLE_ARGS: ${{ inputs.disable-build-cache == 'true' && '--no-build-cache' || '' }}
      run: |
        BUILD_START=$(date +%s)
        ./gradlew "-Dfabric.loom.cache.dir=$HOME/.gradle/caches/fabric-loom" \
          --no-daemon --max-workers=1 --no-watch-fs --console=plain --stacktrace \
          $EXTRA_GRADLE_ARGS \
          :buildAll 2>&1 | tee /tmp/build.log
        BUILD_RC=${PIPESTATUS[0]}
        BUILD_SECONDS=$(( $(date +%s) - BUILD_START ))
        echo "BUILD_RC=$BUILD_RC" >> "$GITHUB_ENV"
        echo "BUILD_SECONDS=$BUILD_SECONDS" >> "$GITHUB_ENV"
        exit "$BUILD_RC"

    - name: 安装 Node 22
      if: inputs.validate-template == 'true'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: e2e/bot/package-lock.json

    # A 车道桩是根构建子模块（ADR-0026：无自有 wrapper / settings），故在仓库根以 JDK 25 守护构建。
    - name: 构建 E2E harness
      if: inputs.validate-template == 'true'
      shell: bash
      env:
        JAVA_HOME: ${{ steps.java25.outputs.path }}
        MPMT_JAVA8_HOME: ${{ steps.java8.outputs.path }}
        MPMT_JAVA17_HOME: ${{ steps.java17.outputs.path }}
        MPMT_JAVA21_HOME: ${{ steps.java21.outputs.path }}
        MPMT_JAVA25_HOME: ${{ steps.java25.outputs.path }}
      run: ./gradlew --no-daemon --max-workers=1 --no-watch-fs --console=plain :e2e:harness:build

    - name: 校验 E2E bot 模板
      if: inputs.validate-template == 'true'
      shell: bash
      working-directory: e2e/bot
      run: |
        npm ci
        npm run lint
        npx prettier --check .
