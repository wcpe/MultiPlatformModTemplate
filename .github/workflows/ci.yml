name: 持续集成

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  # actions/cache 保存 Loom 制品缓存需要写权限；缺它会静默无法保存（或直接报错）。
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  quality:
    name: 全量构建与模板校验
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 构建全部发布车道
        uses: ./.github/actions/build-release-artifacts
        with:
          validate-template: "true"

      # 构建耗时与缓存命中写入 job summary。没有它时，14 分钟的 quality job 在 UI 上
      # 只有一个「success」，无法判断时间是花在编译、测试还是 loom 派生 MC 制品上，
      # 也就无法察觉缓存失效（曾因缓存路径与 -Dfabric.loom.cache.dir 错位而整轮无效）。
      - name: 生成构建报告
        if: always()
        shell: bash
        run: |
          {
            echo "## 全量构建与模板校验"
            echo
            if [ -n "${BUILD_SECONDS:-}" ]; then
              echo "| 项 | 值 |"
              echo "|---|---|"
              echo "| 退出码 | ${BUILD_RC:-unknown} |"
              echo "| 耗时 | $((BUILD_SECONDS / 60))分$((BUILD_SECONDS % 60))秒（${BUILD_SECONDS}s） |"
            else
              echo "> 构建未执行到记录耗时（上一步提前失败）。"
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f /tmp/build.log ]; then
            # Gradle 的任务统计：executed / from-cache / up-to-date 三者的比例直接反映缓存有效性。
            STATS=$(grep -E "^[0-9]+ actionable tasks:" /tmp/build.log | tail -1)
            if [ -n "$STATS" ]; then
              echo "**任务统计**：\`$STATS\`" | tee -a "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi

            # loom 的缓存复用情况：出现「共享缓存产物不可复用」说明 MC 制品在重新派生，
            # 这是 :buildAll 的主要固定开销，出现得多就说明 loom 缓存没生效。
            REGEN=$(grep -c "共享缓存产物不可复用" /tmp/build.log || true)
            CACHE_HIT=$(grep -c "命中\|reused\|from cache" /tmp/build.log || true)
            {
              echo "| 指标 | 值 |"
              echo "|---|---|"
              echo "| loom 制品重新生成次数 | ${REGEN} |"
              echo "| Gradle 缓存命中任务数 | ${CACHE_HIT} |"
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY"

            # 构建失败时把错误段落摘出来，省得去翻完整日志。
            if [ "${BUILD_RC:-0}" != "0" ]; then
              echo "<details><summary>构建失败摘要</summary>" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              grep -A 20 "What went wrong" /tmp/build.log | head -40 >> "$GITHUB_STEP_SUMMARY" || tail -40 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              echo "</details>" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # 耗时归因：把「16 分钟花在哪」按任务类别拆开，同时给出任务密集时段。
      # 之前 summary 只报总耗时，无法回答「是编译慢、测试慢，还是静态分析慢」，
      # 也就无法判断该优化什么。这里用 Gradle 输出的任务完成时间戳做归因：
      # 同一类任务的首末时间戳之差（含等待）即可看出该类占了多少墙钟时间。
      - name: 耗时归因
        if: always()
        shell: bash
        run: |
          if [ ! -f /tmp/build.log ]; then
            echo "> 无 /tmp/build.log，跳过耗时归因。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          import re, datetime
          from collections import defaultdict

          # 按任务名归类。顺序敏感：先匹配更具体的。
          CATEGORIES = [
              ("静态分析 (spotbugs/pmd/checkstyle/detekt)", ("spotbugs", "pmd", "checkstyle", "detekt")),
              ("格式检查 (ktlint)", ("ktlint",)),
              ("覆盖率 (jacoco)", ("jacoco",)),
              ("测试 (test)", ("test",)),
              ("loom (MC 制品/映射/AT)", ("loom", "Minecraft", "mappings", "accessTransform",
                                          "generateForge", "manipulate", "remapMinecraft",
                                          "reobf", "remapJar")),
              ("编译 (compileJava/classes)", ("compile", "classes")),
              ("打包 (jar/shadow)", ("jar", "shadow")),
          ]

          def categorize(task):
              low = task.lower()
              for name, pats in CATEGORIES:
                  if any(p.lower() in low for p in pats):
                      return name
              return "其它 (processResources 等)"

          evts = []
          for line in open("/tmp/build.log", encoding="utf-8", errors="ignore"):
              if "> Task :" not in line:
                  continue
              m = re.search(r"(\d{4}-\d\d-\d\dT[\d:]+)\.\d+Z.*> Task :([\w:.\-]+)", line)
              if m:
                  evts.append((datetime.datetime.fromisoformat(m.group(1)), m.group(2)))
          if not evts:
              print("> 未能从构建日志解析出任务时间戳。")
              raise SystemExit

          evts.sort()
          span = (evts[-1][0] - evts[0][0]).total_seconds()

          # 每个类别：任务数 + 首末时间戳跨度（反映该类在关键路径上占了多久）
          stats = defaultdict(lambda: {"n": 0, "first": None, "last": None})
          for ts, task in evts:
              s = stats[categorize(task)]
              s["n"] += 1
              if s["first"] is None:
                  s["first"] = ts
              s["last"] = ts

          print()
          print("## 耗时归因")
          print()
          print(f"构建跨度 **{span/60:.1f} 分**，共 {len(evts)} 个任务完成事件。")
          print()
          print("> 「跨度」是该类首个任务开始到末个任务完成的墙钟时间，含并行等待，")
          print("> 因此各类跨度之和会大于总时长；用它看**哪类占据了时间轴**，而不是精确耗时。")
          print()
          print("| 类别 | 任务数 | 首任务 | 末任务 | 跨度 |")
          print("|---|---|---|---|---|")
          rows = sorted(stats.items(), key=lambda kv: -(kv[1]["last"] - kv[1]["first"]).total_seconds())
          for name, s in rows:
              d = (s["last"] - s["first"]).total_seconds()
              print(f"| {name} | {s['n']} | {s['first'].strftime('%H:%M:%S')} "
                    f"| {s['last'].strftime('%H:%M:%S')} | {d/60:.1f} 分 |")

          # 最长「无任务完成」间隔：期间必然在跑单个长任务，是真正的串行瓶颈点
          gaps = []
          for i in range(len(evts) - 1):
              sec = (evts[i + 1][0] - evts[i][0]).total_seconds()
              gaps.append((sec, evts[i][1], evts[i + 1][1]))
          gaps.sort(reverse=True)
          print()
          print("**最长的 5 个「无任务完成」间隔**（期间在跑单个长任务，是串行瓶颈点）：")
          print()
          print("| 秒 | 前一个完成的任务 | 后一个完成的任务 |")
          print("|---|---|---|")
          for sec, before, after in gaps[:5]:
              print(f"| {sec:.0f} | `{before[-46:]}` | `{after[-46:]}` |")
          PY

      # 测试与覆盖率汇总：按模块列出用例数、失败数，一眼能看出哪块退化了。
      - name: 汇总测试结果
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          from collections import defaultdict

          # 一个模块下会有多个测试类文件，须按模块聚合，否则同一模块会重复出现多行。
          agg = defaultdict(lambda: [0, 0, 0, 0])
          for path in glob.glob("**/build/test-results/test/*.xml", recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              module = path.split("/build/")[0].replace("/", ":")
              acc = agg[module]
              for i, key in enumerate(("tests", "failures", "errors", "skipped")):
                  acc[i] += int(root.get(key, 0) or 0)

          print("## 测试结果")
          print()
          if not agg:
              print("> 未找到测试结果文件（可能构建在测试前就失败了）。")
          else:
              total = [sum(v[i] for v in agg.values()) for i in range(4)]
              passed = total[0] - total[1] - total[2]
              rate = passed / total[0] * 100 if total[0] else 0.0
              print(f"**合计**：{total[0]} 用例 / 失败 {total[1]} / 错误 {total[2]} / 跳过 {total[3]}"
                    f" —— 通过率 {rate:.1f}%")
              print()
              print(f"<details><summary>按模块明细（{len(agg)} 个模块）</summary>")
              print()
              print("| 模块 | 用例 | 失败 | 错误 | 跳过 |")
              print("|---|---|---|---|---|")
              for module, (t, f, e, s) in sorted(agg.items(), key=lambda kv: -kv[1][0]):
                  flag = " ❌" if (f or e) else ""
                  print(f"| `{module}`{flag} | {t} | {f} | {e} | {s} |")
              print()
              print("</details>")
          PY

      - name: 上传构建诊断
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/acceptance/**
            **/build/mc-testkit/results/**
            **/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: 上传默认分支发布制品
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-artifacts-${{ github.sha }}
          path: build/dist/**
          if-no-files-found: error
          retention-days: 30

# E2E 版本矩阵：用 mc-testkit（远端 Maven 的 0.9.3）逐格并行起真实服务端跑 A 车道场景。
# 每格 = 一个 MC 版本/平台 + 该版本的产品 jar；结果文件由 e2e-report 汇总成一份报告。
  e2e-matrix:
    name: E2E 矩阵 · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Paper 1.20.1
            lane: ":platform:bukkit:1.20.1"
            product: platform/bukkit/1.20.1
            task: ":e2e:harness:e2eSmoke"
          - name: Folia 1.20.1
            lane: ":platform:bukkit:1.20.1"
            product: platform/bukkit/1.20.1
            task: ":e2e:harness:e2eSmokeFolia"
          - name: Paper 1.21.1
            lane: ":platform:bukkit:1.21.1"
            product: platform/bukkit/1.21.1
            task: ":e2e:harness:e2eSmoke1211"
          - name: Paper 26.2
            lane: ":platform:bukkit:26.2"
            product: platform/bukkit/26.2
            task: ":e2e:harness:e2eSmoke262"
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 Java 8（toolchain 目标）
        id: java8
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "8"

      - name: 安装 Java 17（1.20.1 后端）
        id: java17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Java 21（1.21.1 后端）
        id: java21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Java 25（26.2 后端与根构建守护）
        id: java25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      # Loom 的 MC 映射 / dev jar（约数 GB）不在 setup-gradle 默认缓存范围内，
      # 每次冷启动都要重新派生。
      #
      # **本格只恢复、不保存**：loom 缓存只由 quality job 独占写入（它跑全车道，
      # 缓存内容最完整）。原因有两个：
      #   · 体积：assets/(1.4G) + minecraftMaven/(1.0G) 是全版本共享的，4 格各存一份
      #     会再吃掉 10GB 配额——这正是之前 quality job 的 loom 缓存被挤掉、
      #     长期 "Cache not found" 的根因；
      #   · 一致性：多写者用同一个 key 保存不同内容，会让缓存命中到不完整的副本。
      # 用 actions/cache/restore（只读）复用 quality 的 key 格式，命中即省下派生开销，
      # 未命中则本格自行派生（单车道成本可接受），不污染缓存。
      - name: 恢复 Loom 制品（只读）
        uses: actions/cache/restore@v4
        with:
          # 与 quality job 的「缓存 Loom 制品」保持同一套 path（见
          # .github/actions/build-release-artifacts/action.yml）：
          # 除了 ~/.gradle 下的共享制品，还包括各车道的 build/loom-cache。
          # 缺后者时 remapMinecraft* 的输出为空，本格仍要重新派生（单格 ~150s）。
          path: |
            ~/.gradle/caches/fabric-loom
            platform/*/*/build/loom-cache
          key: loom-${{ runner.os }}-all-${{ hashFiles('gradle.properties', 'platform/**/build.gradle.kts') }}
          restore-keys: |
            loom-${{ runner.os }}-all-

      # 本格的产品 jar：只有它进被测插件注入；其余车道不构建（矩阵各格自足）。
      - name: 构建本格产品 jar
        shell: bash
        env:
          JAVA_HOME: ${{ steps.java25.outputs.path }}
          MPMT_JAVA8_HOME: ${{ steps.java8.outputs.path }}
          MPMT_JAVA17_HOME: ${{ steps.java17.outputs.path }}
          MPMT_JAVA21_HOME: ${{ steps.java21.outputs.path }}
          MPMT_JAVA25_HOME: ${{ steps.java25.outputs.path }}
        run: |
          # loom 缓存目录必须与上面 actions/cache 的 path（~/.gradle/caches/fabric-loom）
          # 一致，否则恢复出来的 MC 制品一次都用不上，每格都要重新下载并派生。
          ./gradlew "-Dfabric.loom.cache.dir=$HOME/.gradle/caches/fabric-loom" \
            --no-daemon --max-workers=2 --no-watch-fs --console=plain \
            ${{ matrix.lane }}:shadowJar

      # mc-testkit 编排：起真实服务端、注入产品 jar 与桩 jar、读结果文件判 PASS/FAIL。
      # 插件坐标直接解析远端 WCPE Releases（0.9.3 与 harness-core 0.1.1 均已发布），无需本地发布。
      - name: 运行 mc-testkit E2E（${{ matrix.name }}）
        shell: bash
        env:
          JAVA_HOME: ${{ steps.java25.outputs.path }}
          MPMT_JAVA8_HOME: ${{ steps.java8.outputs.path }}
          MPMT_JAVA17_HOME: ${{ steps.java17.outputs.path }}
          MPMT_JAVA21_HOME: ${{ steps.java21.outputs.path }}
          MPMT_JAVA25_HOME: ${{ steps.java25.outputs.path }}
          MC_TESTKIT_JAVA_HOME_17: ${{ steps.java17.outputs.path }}
          MC_TESTKIT_JAVA_HOME_21: ${{ steps.java21.outputs.path }}
          MC_TESTKIT_JAVA_HOME_25: ${{ steps.java25.outputs.path }}
        run: |
          MC_VERSION=$(basename "${{ matrix.product }}")
          JAR="${{ matrix.product }}/build/libs/mpmt-bukkit-${MC_VERSION}-$(cat VERSION).jar"
          test -f "$JAR" || { echo "[e2e] 未找到产品 jar：$JAR"; exit 1; }
          echo "[e2e] 被测插件：$JAR"
          MC_TESTKIT_E2E_PLUGIN_UNDER_TEST_JAR="$PWD/$JAR" \
            ./gradlew "-Dfabric.loom.cache.dir=$HOME/.gradle/caches/fabric-loom" \
              --no-daemon --max-workers=2 --no-watch-fs --console=plain \
              ${{ matrix.task }}

      - name: 上传本格结果文件
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-results-${{ strategy.job-index }}-${{ matrix.name }}
          path: e2e/harness/build/mc-testkit/results/**
          if-no-files-found: warn
          retention-days: 14

  # 聚合报告：把各格结果文件汇总成一张表写进 workflow summary，任一格非 PASS 即失败。
  e2e-report:
    name: E2E 矩阵聚合报告
    needs: e2e-matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: 下载各格结果文件
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 本 job 不检出仓库，故显式指定 -R；下载失败不静默（下一步会逐格报 MISSING 并失败）。
          gh run download "${{ github.run_id }}" -R "${{ github.repository }}" \
            -p 'e2e-results-*' -D e2e-results
          find e2e-results -name '*.properties' | sort

      - name: 汇总报告
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, sys

          root = pathlib.Path("e2e-results")
          cells = {}
          for path in sorted(root.rglob("*.properties")):
              values = {}
              for line in path.read_text(encoding="utf-8", errors="replace").splitlines():
                  if "=" in line:
                      key, value = line.split("=", 1)
                      values[key.strip()] = value.strip()
              scenario = values.get("scenario") or path.stem
              cells[scenario] = values

          expected = {
              "smoke": "Paper 1.20.1",
              "smoke-folia": "Folia 1.20.1",
              "smoke1211": "Paper 1.21.1",
              "smoke262": "Paper 26.2",
          }

          lines = ["| 场景 | 目标 | 结果 | 服务端 | 被测插件 |", "|---|---|---|---|---|"]
          failed = []
          for scenario, label in expected.items():
              values = cells.get(scenario)
              status = (values or {}).get("status", "MISSING")
              server = (values or {}).get("server", "-")
              under_test = (values or {}).get("pluginUnderTest", "-")
              lines.append(f"| {scenario} | {label} | {status} | {server} | {under_test} |")
              if status != "PASS":
                  failed.append(f"{scenario}={status}")

          report = "\n".join(lines)
          print(report)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## E2E 版本矩阵（mc-testkit）\n\n")
                  handle.write(report + "\n")

          if failed:
              print(f"[e2e-report] 非 PASS 或缺失：{', '.join(failed)}", file=sys.stderr)
              sys.exit(1)
          print("[e2e-report] 全部矩阵场景 PASS")
          PY
