name: 依赖审查

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: 审查新增依赖
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: 审查依赖风险
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: high
          license-check: false
